name: Physics core and asset integrity
on: [push, pull_request]
jobs:
  physics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.426'
      - run: python3 Tools/verify-project.py
      - run: dotnet run --project Tests/Physics/ImpactDrive.Physics.Tests.csproj --configuration Release -- --report Artifacts/Physics/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physics-results
          path: Artifacts/Physics/
          if-no-files-found: warn
